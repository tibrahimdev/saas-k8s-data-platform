apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspaces.platform.saas.test
spec:
  group: platform.saas.test
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                status:
                  type: string
                  description: Workspace status
                extWorkspaceId:
                  type: string
                  description: "External workspace ID defined by SaaS side"
                bootstrapToken:
                  type: string
                  description: "Workspace bootstrap token"
              required:
                - status
                - extWorkspaceId
                - bootstrapToken
  scope: Namespaced
  names:
    plural: workspaces
    singular: workspace
    kind: Workspace
    shortNames:
      - ws
