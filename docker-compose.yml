name: saas_k8s

networks:
  pdns:
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1

volumes:
  caddy_data:
  caddy_config:
  mariadb:
  pdns-data:

services:
  step-ca:
    image: smallstep/step-ca:latest
    container_name: step-ca
    networks:
      pdns:
    ports:
      - "9000:9000"
    volumes:
      - ./_data/step-ca:/home/step
    restart: unless-stopped

