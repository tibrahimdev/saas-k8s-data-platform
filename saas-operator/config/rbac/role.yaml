---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - platform.tibrahim.dev
  resources:
  - dataplatforms
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.tibrahim.dev
  resources:
  - dataplatforms/finalizers
  verbs:
  - update
- apiGroups:
  - platform.tibrahim.dev
  resources:
  - dataplatforms/status
  verbs:
  - get
  - patch
  - update
