apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: saas-bootstrap
spec:
  compositeTypeRef:
    apiVersion: platform.saas.io/v1alpha1
    kind: SaaSBootstrap

  pipeline:
    - step: bootstrap
      functionRef:
        name: crossplane-contrib-function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: bootstrap-placeholder
            base:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: saas-bootstrap-active
                namespace: saas-system
              data:
                status: "bootstrap triggered"
