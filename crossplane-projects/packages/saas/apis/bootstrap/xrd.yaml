apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: saasbootstraps.platform.saas.io
spec:
  group: platform.saas.io
  names:
    kind: SaaSBootstrap
    plural: saasbootstraps
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - bootstrap
              properties:
                bootstrap:
                  type: object
                  required:
                    - secretRef
                  properties:
                    secretRef:
                      type: object
                      required:
                        - name
                        - namespace
                        - key
                      properties:
                        name:
                          type: string
                          description: Name of the Secret containing the bootstrap token
                        namespace:
                          type: string
                          description: Namespace of the Secret
                        key:
                          type: string
                          description: Secret key holding the bootstrap token
